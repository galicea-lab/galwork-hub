name: Weryfikacja

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: node22
    container:
      image: ghcr.io/catthehacker/ubuntu:act-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Zależności
        run: pip install -r requirements-dev.txt

      # config/config.ini jest w .gitignore (sekrety) - testy potrzebują
      # tylko poprawnej struktury, jak obraz Dockera (Dockerfile: cp ...example).
      - name: Konfiguracja testowa
        run: cp config/config.ini.example config/config.ini

      - name: Znaczniki AI (development)
        run: node scripts/check-ai-comments.mjs

      - name: Lint
        run: ruff check .

      - name: Testy
        run: pytest -q

      - name: Eksport publiczny (próba)
        run: >-
          node scripts/public-export.mjs
          --out "$RUNNER_TEMP/public"
