name: Wydanie

# Wydanie wersji uruchamiane tagiem v* . Kolejność jobów gwarantuje, 
# że nic nie zostanie opublikowane, jeśli wcześniejszy krok się nie powiedzie:
#   verify -> github-mirror
# Job `image` (obraz w rejestrze Forgejo) jest WYŁĄCZONY (`if: ${{ false }}`) -
# obrazy są dziś budowane poza Forgejo (galwork/scripts/build_hub.sh,
# registry.galicea.org). Włączenie: galwork-dev-jw/forgejo-register.md.
# Mirror GitHub tylko dla projektów otwartych (w repo jest .public-paths)
# i tylko dla wersji produkcyjnych (tag bez "-", np. v1.2.0; v1.2.0-rc.1
# nie jest publikowany na GitHubie).
#
# Sekrety repozytorium w Forgejo:
#   PACKAGES_USER  - użytkownik Forgejo, do którego należy token
#   PACKAGES_TOKEN - token Forgejo z uprawnieniem write:package
#   MIRROR_TOKEN   - fine-grained PAT z contents: write dla MIRROR_REPO
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: code.galicea.org
  IMAGE: code.galicea.org/galicea/galwork-hub
  MIRROR_REPO: galicea-lab/galwork-hub

jobs:
  verify:
    runs-on: node22
    container:
      image: ghcr.io/catthehacker/ubuntu:act-22.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      public: ${{ steps.meta.outputs.public }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Tag zgodny z wersją, na main lub release/*
        id: meta
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          project_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$version" != "$project_version" ]; then
            echo "Tag ${GITHUB_REF_NAME} nie zgadza się z wersją ${project_version} w pyproject.toml." >&2
            exit 1
          fi
          if ! git branch -r --contains "$GITHUB_SHA" | grep -Eq '^\s*origin/(main|release/.+)$'; then
            echo "Tag ${GITHUB_REF_NAME} nie wskazuje na commit z main ani release/*." >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [ -f .public-paths ]; then echo "public=true" >> "$GITHUB_OUTPUT"; else echo "public=false" >> "$GITHUB_OUTPUT"; fi
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Zależności
        run: pip install -r requirements-dev.txt

      # config/config.ini jest w .gitignore (sekrety) - testy potrzebują
      # tylko poprawnej struktury, jak obraz Dockera (Dockerfile: cp ...example).
      - name: Konfiguracja testowa
        run: cp config/config.ini.example config/config.ini

      - name: Znaczniki AI (wydanie)
        run: node scripts/check-ai-comments.mjs --release

      - name: Lint
        run: ruff check .

      - name: Testy
        run: pytest -q

  image:
    # Wyłączone - obraz budowany poza Forgejo (zob. nagłówek pliku).
    if: ${{ false }}
    needs: verify
    runs-on: node22
    # wymaga dostępu do demona Dockera w kontenerze joba (gniazdo
    # /var/run/docker.sock udostępnione w konfiguracji runnera Forgejo).
    container:
      image: ghcr.io/catthehacker/ubuntu:act-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Logowanie do rejestru Forgejo
        env:
          REGISTRY_USER: ${{ secrets.PACKAGES_USER }}
          REGISTRY_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$REGISTRY_USER"
          test -n "$REGISTRY_TOKEN"
          echo "$REGISTRY_TOKEN" | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin

      - name: Build i push obrazu
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          tags=(-t "${IMAGE}:${VERSION}")
          if [ "$PRERELEASE" = "false" ]; then
            tags+=(-t "${IMAGE}:latest")
          fi
          docker build "${tags[@]}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${SOURCE_URL}" \
            --label "org.opencontainers.image.licenses=MPL-2.0" \
            .
          docker push --all-tags "$IMAGE"

      - name: Wylogowanie
        if: always()
        run: docker logout "$REGISTRY" || true

  github-mirror:
    # Po włączeniu joba `image` przywróć: needs: [verify, image]
    needs: verify
    if: ${{ needs.verify.outputs.public == 'true' && needs.verify.outputs.prerelease == 'false' }}
    runs-on: node22
    container:
      image: ghcr.io/catthehacker/ubuntu:act-22.04
    concurrency:
      group: github-mirror
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Eksport publiczny
        env:
          PUBLIC_SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: >-
          node scripts/public-export.mjs
          --release --require-license
          --out "$RUNNER_TEMP/public"
          --source-url "$PUBLIC_SOURCE_URL"
          --tag "$GITHUB_REF_NAME"

      - name: Push mirrora
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: >-
          bash scripts/push-github-mirror.sh
          "$RUNNER_TEMP/public" "$MIRROR_REPO" "$GITHUB_REF_NAME" "$GITHUB_SHA"
